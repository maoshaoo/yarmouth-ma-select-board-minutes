# Which Yarmouth, MA meetings to mirror.
# Video comes from the Town's Cablecast VOD server (Government Channel 8).

[source]
base_url = "https://vod.yarmouth.ma.us"
channel_name = "Town of Yarmouth Government Channel 8"

# Only shows whose title matches one of these (case-insensitive regex) are processed.
# Add more boards here, e.g. "planning board", "board of health", "finance committee".
title_patterns = ["select board", "town meeting"]

# Ignore anything older than this when backfilling.
earliest_date = "2025-01-01"

# Max new meetings per run (keeps a GitHub Actions run under its 6-hour limit).
max_per_run = 3

[transcribe]
# faster-whisper model: tiny, base, small, medium. "small" is a good CPU tradeoff.
model = "small"

[summarize]
model = "claude-sonnet-5-5"
